services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unsungheroes
      POSTGRES_USER: unsungheroes_app
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data


  backend:
   build: ./backend
   environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: unsungheroes
      DB_USER: unsungheroes_app
      DB_PASSWORD: change-me
      ALLOWED_ORIGIN: "*"
   depends_on:
      - db


  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend


volumes:
  pgdata:


  